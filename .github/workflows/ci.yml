name: JobTrail-AI CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend PyTest & Alembic Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Alembic migrations
        run: |
          alembic upgrade head

      - name: Run Test Suite
        env:
          ENVIRONMENT: testing
          DATABASE_URL: sqlite:///./test_ci.db
          JWT_SECRET: ci_test_secret_key_jobtrail_ai_2026_ci_test_token
        run: |
          PYTHONPATH=backend pytest backend/tests/ -v

  frontend-build:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://jobtrail-ai.onrender.com
        run: npm run build
